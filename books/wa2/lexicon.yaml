# 读音表：词 → 合成时实际送进 TTS 的写法。全角字母数字在合成前统一转半角，不必列在这里。
# 两种写法：
# - 换成同音的常用字；
# - IndexTTS-2.5 的拼音标注 <字|拼音声调>：拼音大写，声调 1–5（5 是轻声），只能用 IndexTTS 的
#   checkpoints/pinyin.vocab 里有的写法，ü 一律写 V（雪 XVE3、绿 LV4）。拼音不算进字数；
#   Qwen3 不认标注，走 Qwen3 的文本要先去掉（rawanchor.plain）。
# 「雪菜」试过 <雪|XVE3>菜：标注的声调管用（标二声就全读成「学」），但标三声以后读成二声的反而多了，
# 用户听下来大多不标更好，所以没加（生产 03 号票）。
小木曾: 小木增   # 曾 读 zēng
小木曽: 小木增
依緒: 依绪
美穂子: 美穗子
浜田: 滨田
