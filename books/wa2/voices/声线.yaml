# 原作声线库（生产 04 号票），规则见 readbook/voicelines.py 和合成规格第四节。只记量出来的数，原声不进 git；
# 每条声线的语音文件按 语音对照.tsv 现取（voicelines.files）。98、99 号混着几个声优，不做声线。
# - 声线名「声优-角色…」，查不到声优的写「编号号」。PC 版没公开声优，按 PS3 版、日文维基、VNDB 的署名；
# - 角色：这条声线配的角色和全书句数（按语音文件去重），第一个是主角色。说话人空着或「？？？」的算进主角色；
#   可用原声不到 20 句的角色借主角色的声线；
# - 原声句数：可用原声（1.5–12 秒、测得出音高和语速）；音高中位（Hz）、日语语速中位（字/秒）按它算；
# - 性别：按声优，查不到的按角色，用声纹核对过（voicelines.MALE；音高分不开男女）；
# - 音色门槛：evaluate.voice_gate 的 center_p5，原声按 evaluate.real_clips 取（1.5–15 秒，最多 300 句，种子 0）；
# - 互认：和同一个声优的其他声线互相认人时，这条声线的原声认对的比例（最多 300 句可用原声）；
# - 音色锚点（生产 05 号票，rawanchor.make_lines，规则见 readbook/rawanchor.py 和合成规格第四节）：
#   锚点＝锚点录音，路径相对 books/wa2/voices/；锚点文本＝它念的字；锚点像原声＝它和这条声线原声中心的
#   相似度（整段，CAM++）；目标音高（Hz）、目标语速（字/秒）是逐句质检的目标。挑选的明细在 锚点.yaml。
