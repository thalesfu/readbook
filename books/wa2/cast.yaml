    desc: 和泉千晶，春希的同学，剧团女演员，慵懒随性、捉摸不透。年轻女声，懒散拖腔，可塑性强。
    style: 年轻女声，慵懒拖腔，漫不经心，语调起伏大，像在演戏。
    card:
