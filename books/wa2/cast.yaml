  男青年A: 青年男声，二十多岁，普通自然，略带朝气。
  男青年B: 青年男声，二十多岁，偏低沉，平稳。
  男中年A: 中年男声，四十岁上下，温和客气。
  男中年B: 中年男声，四十岁上下，嗓音粗一些，爽朗。
  男老年: 老年男声，六十岁以上，缓慢沙哑。
  女青年A: 年轻女声，二十岁上下，明亮活泼。
  女青年B: 年轻女声，二十多岁，柔和平稳。
  女中年A: 中年女声，四十岁上下，亲切。
  女中年B: 中年女声，四十岁上下，干练。
  广播: 女声，标准播音腔，清晰平稳。
