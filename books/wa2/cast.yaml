# 《白色相簿2》角色表
#
# tier：主要（≥500 句）/ 配角（30–499 句）/ 龙套（<30 句）
# code：游戏语音编号（VOICE.PAK 文件名最后一段）。有编号的角色复刻；
#       98/99 是多个龙套共用的，不复刻，走 pool 里的设计音色。
# pan：立体声偏移，-1 最左、+1 最右；只作用于台词，旁白和心理活动一律居中。
# style：说话风格，生成中文定妆音时当作指令。
# desc：人物与声音描述。没有编号的角色用它设计音色，有编号的角色当作补充说明。
# card：性格卡（11 号票），定逐句表演设置时给 LLM 看，主要角色都有、格式一样：
#       性格 / 情绪外露（情绪怎么表现在声音里）/ 声音。没有卡的角色用 desc。
# aliases：剧本里出现过的其他写法。

book: 白色相簿2 剧本全集
narrator: 春希   # 第一人称叙述者，旁白用他的音色

characters:
  春希:
    tier: 主要
    code: "00"
    gender: 男
    age: 20
    pan: -0.1   # 主角台词稍偏，和居中的旁白拉开
    desc: 北原春希，大学三年级，认真、爱操心、理性克制，说话条理清楚，常带自嘲；内心独白多，情绪压抑。青年男声，中低音，干净。
    style: 青年男声，中低音，咬字清楚，语速中等偏快；平时理性克制，爱讲道理，常带点自嘲，着急时语速变快。
    card:
      性格: 认真、爱操心、责任感强，理性克制，爱讲道理，常带自嘲；对雪菜和和纱怀着很深的愧疚。
      情绪外露: 习惯把情绪压在理性下面，难过、痛苦多半闷着低声说，很少放声；着急时语速变快、连连追问；温柔时放软放低。旁白是回顾往事的讲述，平静里带着压抑。
      声音: 青年男声，中低音；轻声是压低、放慢。
  雪菜:
    tier: 主要
    code: "02"
    gender: 女
    age: 20
    pan: -0.15
    desc: 小木曾雪菜，开朗温柔、受欢迎的优等生，会唱歌；表面明亮，内心敏感。年轻女声，明亮甜美，偏高。
    style: 年轻女声，明亮甜美，语气温柔亲切、带着笑意，句尾常轻轻上扬；难过时声音发颤但努力克制。
    card:
      性格: 开朗温柔、受欢迎的优等生，会唱歌；表面明亮，内心敏感、自卑，这几年一直戴着笑脸的面具。
      情绪外露: 难过、受伤时常强撑出笑意，用「呢」「哦」把话说软，越在意越小心翼翼；慌乱时结巴、语无伦次、干笑；撑不住时才哭出来。
      声音: 年轻女声，明亮甜美，偏高；轻声细而软。
  和纱:
    tier: 主要
    code: "01"
    gender: 女
    age: 20
    pan: 0.15
    aliases: [かずさ]
    desc: 冬马和纱，天才钢琴家，冷淡、嘴硬、别扭，独处时脆弱。年轻女声，低沉偏冷，语速慢，带点慵懒。
    style: 年轻女声，低沉偏冷，语速慢，懒洋洋、爱答不理，句尾干脆下沉，嘴硬，偶尔流露脆弱。
    card:
      性格: 天才钢琴家，冷淡、嘴硬、别扭，不擅长表达；独处或面对春希时脆弱。
      情绪外露: 情绪多藏在冷淡和不耐烦底下，生气时短促尖刻，害羞时更冲、更嘴硬；真正动情时声音发颤、变小。
      声音: 年轻女声，低沉偏冷，语速慢，带点慵懒。
  依绪:
    tier: 主要
    code: "11"
    gender: 女
    age: 20
    pan: -0.1
    aliases: [依緒]
    desc: 水泽依绪，春希和雪菜的朋友，爽快泼辣、讲义气，说话直。年轻女声，中音，利落有力。
    style: 年轻女声，中音，爽快直接，语速偏快，带点大姐头的强势和调侃，说话不拐弯。
    card:
      性格: 爽快泼辣、讲义气，护着雪菜，说话直，有大姐头的强势。
      情绪外露: 情绪直接外放，不满就带刺，开心就大声嚷；心里愧疚或担心时硬撑着用调侃带过，语气一沉就是动了真情。
      声音: 年轻女声，中音，利落有力；兴奋时嗓门大。
  武也:
    tier: 主要
    code: "10"
    gender: 男
    age: 20
    pan: 0.1
    desc: 饭冢武也，春希的损友，轻浮开朗、爱起哄但重感情。青年男声，明亮，语速快。
    style: 青年男声，明亮轻快，嗓门大，油腔滑调爱起哄，语速快，说话带笑。
    card:
      性格: 轻浮开朗、爱起哄，嘴贫，但重感情、讲义气。
      情绪外露: 习惯用嬉皮笑脸和玩笑掩饰尴尬和担心，情绪外放；认真起来会突然收起笑意。
      声音: 青年男声，明亮，嗓门大，语速快。
  曜子:
    tier: 主要
    code: "16"
    gender: 女
    age: 45
    pan: 0.2
    desc: 冬马曜子，和纱的母亲，世界级钢琴家兼经纪公司社长，豪爽、强势、爱开玩笑。成熟女声，沙哑有磁性，带笑意。
    style: 成熟女声，略带沙哑、有磁性，豪爽爱笑，拖长尾音，说话随性像带着醉意。
    card:
      性格: 世界级钢琴家兼经纪公司社长，豪爽、强势、爱开玩笑，看人通透。
      情绪外露: 多半带着笑意和调侃，严肃的话也说得随意；真正关心时语气放缓，但不煽情。
      声音: 成熟女声，略沙哑、有磁性，爱拖长尾音。
  麻理:
    tier: 主要
    code: "05"
    gender: 女
    age: 28
    pan: -0.2
    desc: 风冈麻理，开桜社编辑部的上司，干练、工作狂，私下有可爱一面。成熟女声，干脆利落。
    style: 成熟女声，干练利落，语速快，命令式口吻，偶尔流露关心。
    card:
      性格: 编辑部上司，干练、工作狂、要强，私下有可爱、寂寞的一面。
      情绪外露: 工作时干脆、命令式，关心也说得像命令；私下放松时会撒娇、闹别扭。
      声音: 成熟女声，干脆利落，语速快。
  千晶:
    tier: 主要
    code: "04"
    gender: 女
    age: 20
