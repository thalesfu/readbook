    style: 年轻女声，慵懒拖腔，漫不经心，语调起伏大，像在演戏。
  小春:
    tier: 主要
    code: "03"
    gender: 女
    age: 17
    pan: -0.2
    desc: 杉浦小春，春希打工处的高中生后辈，认真正直、爱管闲事。少女声，清亮，语气认真。
    style: 少女声，清亮，认真正直，语气一板一眼，有点较真。
  店员:
    tier: 龙套
    code: "99"
    gender: 男
    age: 40
    pan: 0.15
    desc: 演出场地的中年男店员，客气热情。
  工作人员１:
    tier: 龙套
    code: "99"
    gender: 男
    age: 30
    pan: 0.25
