[project]
name = "readbook"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "ebooklib>=0.20",
    "mlx-audio>=0.6.1; sys_platform == 'darwin'",
    "numpy>=2.5.4",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
    # Windows 5090（Blackwell）：cu128 这条线最新到 2.11.0
    "torch==2.11.0; sys_platform == 'win32'",
    "torchaudio==2.11.0; sys_platform == 'win32'",
    # Norton 的加密连接扫描会换掉证书：readbook/config.py 里用 truststore 改认 Windows 证书库。
    # 不用 pip-system-certs：它注入的是 pip 自带的那份 truststore，和 huggingface_hub 用的这份叠在一起会无限递归
    "truststore>=0.10.5; sys_platform == 'win32'",
    "funasr>=1.4.16 ; sys_platform == 'win32'",
    "transformers>=5.20.2 ; sys_platform == 'win32'",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128", marker = "sys_platform == 'win32'" }
torchaudio = { index = "pytorch-cu128", marker = "sys_platform == 'win32'" }
